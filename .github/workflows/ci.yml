name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# 仓库根目录就是 Go module 根目录（go.mod 在根，vendor/ 在根）。
# 所有 step 直接在默认工作目录执行，不要再加 working-directory。
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Go 版本只有一个真源：go.mod 的 `go` 指令。写死版本号会与 go.mod 漂移
      # （例如 go.mod 要求 1.25.12 而 CI 写 1.25.0，只能靠 GOTOOLCHAIN 下载兜底）。
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify dependencies
        run: go mod verify

      # 只检查「构建图内」的 Go 文件 —— scripts/fmt-check.sh 用 go list 裁剪范围。
      # gofmt 不认 '_' 前缀目录，也不认 //go:build ignore；直接扫 '.' 会把归档与
      # vendor/ 里的第三方代码算进结果。
      - name: Check formatting
        run: ./scripts/fmt-check.sh

      - name: Build
        run: go build ./...

      # 宿主（ubuntu runner）只编译 `!windows` 分支 —— 平台分体文件里的编译错误
      # 在宿主上永远暴露不出来。这里做纯交叉编译，覆盖三套 build tag 组合。
      # 边界：只证明「能编译」，不证明运行期行为。
      - name: Cross-platform build (build tags)
        run: |
          for target in windows/amd64 linux/amd64 darwin/arm64; do
            GOOS="${target%%/*}" GOARCH="${target##*/}" CGO_ENABLED=0 go build ./...
            echo "OK  $target"
          done

      - name: Vet
        run: go vet ./...

      # 失败用例名必须自己"喊"出来：Actions 的日志正文只有登录态能读（`/logs` 匿名 403、
      # 页面 HTML 也不含日志），check-run 的 **annotation** 才是匿名可读的。
      # 不做这一步时，红了的唯一线索是 `FAIL <pkg> 37.492s`，定位只能靠人贴日志。
      - name: Test with race detector
        run: |
          set -o pipefail
          # ★ `rc=0; ... || rc=$?` 而不是直接跑：Actions 默认 shell 是 `bash -e`，
          #   测试一失败就会**在赋值之前**整步退出（第一次接注解时就是这么哑的：
          #   注解一条没出来，只剩 Actions 自己的 "exit code 1"）。
          rc=0
          # `-p 2`：包级并发上限。race 下每个包本身就很吃 CPU，默认按核数铺开时
          # 一批"等 N 秒"的用例会互相把对方挤过时限（同一份代码每次红的用例都不一样，
          # 曾出现 bridge / mcp / tools 轮流出红）。限并发只是让计时类判据不被自己人
          # 干扰；真正的竞态仍按用例逐个修（例如 WS 通知早于 handler、进程退出早于输出收齐）。
          go test -count=1 -race -p 2 ./... 2>&1 | tee /tmp/go-test.log || rc=$?
          if [ "$rc" -ne 0 ]; then
            # 一次重试，只为把「时序抖动」和「真回归」分开：重试仍红才判红。
            # ★ 不静默：重试通过也会打 ::warning:: 并点名失败的包 —— 绿是绿了，
            #   但那几条判据还欠修（本仓历史：每轮红点都会换个用例出现）。
            # awk 而不是 sed：`\+` 在 BSD sed 的 BRE 里不生效，awk 的 ERE 三平台一致。
            pkgs="$(awk '/^FAIL[[:space:]]+github[.]com/ {print $2}' /tmp/go-test.log | sort -u | tr '\n' ' ')"
            if [ -n "$pkgs" ]; then
              echo "::warning::首轮失败包：${pkgs}——只重试这些包一次"
              retry_rc=0
              go test -count=1 -race -p 2 $pkgs 2>&1 | tee /tmp/go-test-retry.log || retry_rc=$?
              if [ "$retry_rc" -eq 0 ]; then
                echo "::warning::重试通过：首轮的 ${pkgs} 是时序抖动，不是本次回归 —— 但这几条判据仍需逐个修"
                rc=0
              fi
            fi
          fi
          if [ "$rc" -ne 0 ]; then
            python3 .github/scripts/annotate_test_failures.py /tmp/go-test.log || true
            exit "$rc"
          fi

  build-binaries:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # -trimpath 是 go build 的编译期开关，不是链接器开关；写进 -ldflags 会让
      # 链接器报 `flag provided but not defined: -trimpath`。
      # 版本号只从 internal/version.Version 注入（单一真源，见 ）。
      # 产物落 dist/（工作区内）—— upload-artifact@v4 只可靠地收工作区内的文件。
      - name: Build all release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          RAW_VERSION="$(git describe --tags --always --dirty)"
          # internal/version.Version 的契约是**不带 v**（展示层统一加 `Whale Code v` 前缀）。
          # 直接注入 tag 原文会让二进制自称 `vv0.1.1` —— 发版时踩过一次，这里先剥前缀。
          VERSION="${RAW_VERSION#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          # `git describe --always` 在没有 tag 时会退化成短提交号 —— 二进制会自称 "f822bde"。
          # 推 main 时忘了 `git push --follow-tags` 就是这个后果，所以显式喊一声。
          case "$RAW_VERSION" in
            v*) ;;
            *) echo "::warning::没有打到当前提交的 tag，版本号退化为 '$VERSION'；发布请带 tag 推（git push --follow-tags）" ;;
          esac
          LDFLAGS="-s -w -buildid= -X github.com/anchorandfish/whale-code/internal/version.Version=${VERSION}"
          for target in windows/amd64 linux/amd64 darwin/amd64 darwin/arm64; do
            os="${target%%/*}"; arch="${target##*/}"
            out="dist/whale-${os}-${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -buildvcs=false -ldflags "$LDFLAGS" -o "$out" .
            ls -lh "$out"
          done

      # `-X` 的包路径写错时链接器不报错、版本号静默停留在源码默认值。
      # 这里在 runner 原生平台（linux/amd64）上真跑一次二进制，把「静默失效」变成红灯。
      - name: Verify injected version
        run: |
          set -euo pipefail
          out="$(./dist/whale-linux-amd64 --version)"
          echo "$out"
          # 逐字相等，不用 `grep -qF`：包含式判定对"多一个 v"不敏感（`vv0.1.1` 里含 `v0.1.1`），
          # 那种假绿正是发版件印出两个 v 的原因。
          if [ "$out" != "Whale Code v${VERSION}" ]; then
            echo "::error::--version 与注入值不一致：期望 'Whale Code v${VERSION}'，实际 '$out'（查 -ldflags -X 的包路径与 v 前缀）"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: whale-binaries
          path: dist/*
          # 默认是 warn：一旦路径写错，构建依旧"成功"、产物却一个都没有。
          if-no-files-found: error
          retention-days: 30
